
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tradio - Reset Password</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <div class="auth-container">

        <h1>Tradio</h1>

        <h2>Create a new password</h2>

        <form id="reset-form">

            <input
                type="password"
                id="password"
                placeholder="New password"
                minlength="8"
                required
            >

            <input
                type="password"
                id="confirm-password"
                placeholder="Confirm new password"
                minlength="8"
                required
            >

            <button type="submit">
                Update password
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script type="module" src="../js/reset-password.js"></script>

</body>
</html>
